<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSSquared - Apple II Emulator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #ddd;
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    /* Site chrome on top, emulator fills whatever is left. */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    /* A compact dark take on the gssquared.net header. Deliberately
       self-contained instead of loading the site's /assets/css/site.css: that
       sheet is a light theme whose body / .site / .site-main rules would fight
       a full-bleed black canvas, and it is not reachable from the dev server. */
    .gs2-chrome {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.25rem 1.5rem;
      padding: 0.35rem 1rem;
      background: #14181c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .gs2-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #f3f0ea;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .gs2-brand img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: cover;
    }
    .gs2-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.15rem 1.1rem;
      font-size: 0.9rem;
    }
    .gs2-nav a {
      color: #9aa6b2;
      font-weight: 600;
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
    }
    .gs2-nav a:hover,
    .gs2-nav a.is-active {
      color: #fff;
      border-bottom-color: #00a1de;
    }
    /* Emulator host. Do not letterbox here: SDL's CreateWindow probe reads this
       CSS size (after a 1×1 backing-store test), and mouse events are scaled
       from the canvas CSS box to the SDL window, so a second CSS aspect box
       would make those two disagree. The emulator letterboxes internally.
       min-height:0 lets this flex item shrink below the canvas's own size. */
    #app {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: #000;
    }
    /* Fill #app. No border/padding/margin — SDL/Emscripten mouse coords break. */
    canvas.emscripten {
      position: absolute;
      inset: 0;
      display: block;
      border: 0 none;
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      cursor: pointer;
      z-index: 10;
      text-align: center;
    }
    #overlay h1 { font-weight: 500; margin: 0 0 0.5em; }
    #overlay p  { opacity: 0.7; margin: 0.25em; }
    #status {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 12px;
      opacity: 0.6;
      z-index: 5;
      pointer-events: none;
    }
    .spinner {
      width: 36px; height: 36px; margin-top: 1em;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #6cf;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Site navigation. Links are absolute gssquared.net paths: dead under the
       dev server, correct once deployed to /live/. The logo lives in the site
       repo, so onerror drops the <img> when it 404s locally. -->
  <header class="gs2-chrome">
    <a class="gs2-brand" href="/">
      <img src="/assets/img/gssquared-mark.png" alt="" onerror="this.remove()">
      <span>GSSquared</span>
    </a>
    <nav class="gs2-nav">
      <a href="/">Home</a>
      <a href="/features">Features</a>
      <a href="/screenshots">Screenshots</a>
      <a class="is-active" href="/live/">Live</a>
      <a href="/news">What's New</a>
      <a href="/download">Download</a>
      <a href="/support">Support</a>
      <a href="/help">Help</a>
    </nav>
  </header>

  <div id="app">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="1288" height="928"></canvas>

    <div id="overlay">
      <h1>GSSquared</h1>
      <p>Apple II Emulator</p>
      <p id="overlay-hint">Loading&hellip;</p>
      <div class="spinner" id="overlay-spinner"></div>
    </div>

    <div id="status">initializing&hellip;</div>
  </div>

  <script type="text/javascript">
    var statusElement  = document.getElementById('status');
    var overlayElement = document.getElementById('overlay');
    var overlayHint    = document.getElementById('overlay-hint');
    var overlaySpinner = document.getElementById('overlay-spinner');
    var runtimeReady   = false;

    var Module = {
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        // Reload the page if WebGL context is lost.
        canvas.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      // SDL's Emscripten backend manages a /tmp/filedrop directory for HTML5
      // drag-and-drop with unguarded FS.mkdir/FS.rmdir calls. SDL re-registers
      // the window's event handlers (e.g. when the window is recreated during
      // setup), so mkdir runs twice and the second throws EEXIST, which unwinds
      // out of SDL_CreateWindow and leaves a black canvas. We can't patch
      // vendored SDL, so make these two FS ops idempotent at the runtime level
      // (EEXIST on mkdir / ENOENT on rmdir become no-ops). Emscripten errno:
      // EEXIST = 20, ENOENT = 44.
      preRun: [function () {
        var origMkdir = FS.mkdir.bind(FS);
        FS.mkdir = function (path, mode) {
          try { return origMkdir(path, mode); }
          catch (e) { if (e && e.errno === 20) return undefined; throw e; }
        };
        var origRmdir = FS.rmdir.bind(FS);
        FS.rmdir = function (path) {
          try { return origRmdir(path); }
          catch (e) { if (e && e.errno === 44) return undefined; throw e; }
        };
      }],
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) {
        if (statusElement) statusElement.textContent = text;
        if (text === '') {
          // Runtime is up; let the user click to start (audio gesture).
          runtimeReady = true;
          overlaySpinner.style.display = 'none';
          overlayHint.innerHTML = 'Click to start<br>Left Option / Windows = Open Apple<br>Right Option/Windows = Close Apple';
          // After layout/paint, ask SDL to re-read CSS (same as a window resize).
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              window.dispatchEvent(new Event('resize'));
            });
          });
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ?
          'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' :
          '');
      }
    };
    Module.setStatus('Downloading...');

    // SDL's Emscripten backend only treats the window as keyboard-focused when
    // the canvas is document.activeElement. After Alt-Tab the browser returns
    // focus to <body>, not the canvas, so keyboard input silently dies. Keep the
    // canvas focused on (re)focus and on any click. This listener is registered
    // at page-parse time, i.e. BEFORE SDL adds its own window 'focus' handler,
    // so the canvas is already the activeElement when SDL checks.
    function focusCanvas() {
      if (Module.canvas && typeof Module.canvas.focus === 'function') {
        Module.canvas.focus();
      }
    }

    window.addEventListener('focus', focusCanvas);
    document.addEventListener('click', focusCanvas);

    // The browser blocks audio until a user gesture. Hide the overlay on the
    // first click once the runtime is ready, and focus the canvas for keyboard.
    overlayElement.addEventListener('click', function () {
      if (!runtimeReady) return;
      overlayElement.style.display = 'none';
      focusCanvas();
      // Same path as a browser resize: SDL re-reads CSS and sizes the backing store.
      window.dispatchEvent(new Event('resize'));
    });

    // Keep the canvas backing store matched to its host if layout changes
    // without a window resize (first paint, overlay, docked DevTools, etc.).
    if (typeof ResizeObserver !== 'undefined') {
      var host = document.getElementById('app');
      if (host) {
        new ResizeObserver(function () {
          window.dispatchEvent(new Event('resize'));
        }).observe(host);
      }
    }

    window.onerror = function (msg) {
      Module.setStatus('Exception thrown, see JavaScript console');
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
