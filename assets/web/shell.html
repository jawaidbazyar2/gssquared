<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSSquared - Apple II Emulator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #ddd;
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    /* Site chrome on top, emulator fills whatever is left. */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    /* A compact dark take on the gssquared.net header. Deliberately
       self-contained instead of loading the site's /assets/css/site.css: that
       sheet is a light theme whose body / .site / .site-main rules would fight
       a full-bleed black canvas, and it is not reachable from the dev server. */
    .gs2-chrome {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.25rem 1.5rem;
      padding: 0.35rem 1rem;
      background: #14181c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .gs2-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #f3f0ea;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .gs2-brand img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: cover;
    }
    .gs2-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.15rem 1.1rem;
      font-size: 0.9rem;
    }
    .gs2-nav a {
      color: #9aa6b2;
      font-weight: 600;
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
    }
    .gs2-nav a:hover,
    .gs2-nav a.is-active {
      color: #fff;
      border-bottom-color: #00a1de;
    }
    /* Emulator host. Do not letterbox here: SDL's CreateWindow probe reads this
       CSS size (after a 1×1 backing-store test), and mouse events are scaled
       from the canvas CSS box to the SDL window, so a second CSS aspect box
       would make those two disagree. The emulator letterboxes internally.
       min-height:0 lets this flex item shrink below the canvas's own size. */
    #app {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: #000;
    }
    /* Fill #app. No border/padding/margin — SDL/Emscripten mouse coords break. */
    canvas.emscripten {
      position: absolute;
      inset: 0;
      display: block;
      border: 0 none;
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      cursor: pointer;
      z-index: 10;
      text-align: center;
    }
    #overlay h1 { font-weight: 500; margin: 0 0 0.5em; }
    #overlay p  { opacity: 0.7; margin: 0.25em; }
    #status {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 12px;
      opacity: 0.6;
      z-index: 5;
      pointer-events: none;
    }
    .spinner {
      width: 36px; height: 36px; margin-top: 1em;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #6cf;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #pack-close {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      z-index: 30;
      text-align: center;
    }
    #pack-close .pack-close-card {
      max-width: 28rem;
      padding: 1.5rem;
    }
    #pack-close p { margin: 0.4rem 0; }
    #pack-close-detail { opacity: 0.75; font-size: 0.9rem; }
    #pack-close button {
      margin: 0.75rem 0.4rem 0;
      padding: 0.45rem 0.9rem;
      font: inherit;
      font-weight: 600;
      color: #111;
      background: #e8e8e8;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
  <script>
    // Read #pack= before analytics. The fragment is the arQyv pack URL,
    // including a short-lived launch token. A query parameter would be sent
    // to this host; the fragment is not. Strip it before any other script,
    // including gtag, so the token is not stored in analytics or history.
    (function () {
      var hash = window.location.hash || '';
      if (hash.indexOf('#pack=') !== 0) return;
      var raw = hash.slice('#pack='.length);
      try { raw = decodeURIComponent(raw); } catch (e) { /* keep the raw text */ }
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      window.__gs2PackRequest = raw;
      // Some browsers apply the fragment after the first head script. Strip
      // again once the document is parsed and once it has loaded.
      var strip = function () {
        if ((window.location.hash || '').indexOf('#pack=') !== 0) return;
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      };
      document.addEventListener('DOMContentLoaded', strip);
      window.addEventListener('load', strip);
    })();
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JWJK6DM7XJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-JWJK6DM7XJ');
  </script>
</head>
<body>
  <!-- Site navigation. Links are absolute gssquared.net paths: dead under the
       dev server, correct once deployed to /live/. The logo lives in the site
       repo, so onerror drops the <img> when it 404s locally. -->
  <header class="gs2-chrome">
    <a class="gs2-brand" href="/">
      <img src="/assets/img/gssquared-mark.png" alt="" onerror="this.remove()">
      <span>GSSquared</span>
    </a>
    <nav class="gs2-nav">
      <a href="/">Home</a>
      <a href="/features">Features</a>
      <a href="/screenshots">Screenshots</a>
      <a class="is-active" href="/live/">Live</a>
      <a href="/news">What's New</a>
      <a href="/download">Download</a>
      <a href="/support">Support</a>
      <a href="/help">Help</a>
    </nav>
  </header>

  <div id="app">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="1288" height="928"></canvas>

    <div id="overlay">
      <h1>GSSquared</h1>
      <p>Apple II Emulator</p>
      <p id="overlay-hint">Loading&hellip;</p>
      <div class="spinner" id="overlay-spinner"></div>
    </div>

    <div id="status">initializing&hellip;</div>

    <div id="pack-close" style="display:none">
      <div class="pack-close-card">
        <p id="pack-close-text">Save this title to your arQyv Collection before closing?</p>
        <p id="pack-close-detail"></p>
        <button id="pack-close-save" type="button">Save to Collection</button>
        <button id="pack-close-discard" type="button">Close without saving</button>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    var statusElement  = document.getElementById('status');
    var overlayElement = document.getElementById('overlay');
    var overlayHint    = document.getElementById('overlay-hint');
    var overlaySpinner = document.getElementById('overlay-spinner');
    var runtimeReady   = false;
    var GS2_PACK_MAX_BYTES = 200 * 1024 * 1024;

    function gs2PackFail(message) {
      var err = new Error(message);
      err.gs2Pack = true;
      return err;
    }

    function gs2ShowPackError(message) {
      window.__gs2PackFailed = true;
      runtimeReady = true;
      if (overlaySpinner) overlaySpinner.style.display = 'none';
      if (overlayHint) overlayHint.textContent = message;
      if (overlayElement) overlayElement.style.display = 'flex';
      if (statusElement) statusElement.textContent = message;
    }

    // https://arqyv.net, plus the local pack server (http://localhost or 127.0.0.1).
    function gs2ParsePackUrl(raw) {
      if (!raw || raw.length > 8192) return null;
      var u;
      try { u = new URL(raw); } catch (e) { return null; }
      var allowed = (u.protocol === 'https:' && u.hostname === 'arqyv.net')
        || (u.protocol === 'http:' && (u.hostname === 'localhost' || u.hostname === '127.0.0.1'));
      if (!allowed || u.username || u.password) return null;
      var name = u.pathname.slice(u.pathname.lastIndexOf('/') + 1);
      try { name = decodeURIComponent(name); } catch (e) { return null; }
      if (!name || name === '.' || name === '..' || name.indexOf('/') >= 0 || name.indexOf('\\') >= 0) {
        return null;
      }
      if (name.length < 8 || name.slice(-8).toLowerCase() !== '.gs2pack') return null;
      return {
        url: u.toString(),
        name: name,
        host: u.host,
        saveUrl: u.origin + u.pathname
      };
    }

    function gs2UsableSecret(text) {
      return typeof text === 'string' && text.length > 0 && text.length <= 4096
        && text.indexOf('\n') < 0 && text.indexOf('\r') < 0;
    }

    function gs2PackErrorMessage(status) {
      if (status === 401) return 'This Play link has expired. Click Play again on arQyv.';
      if (status === 404) return 'That title was not found on arQyv.';
      if (status === 413) return 'That pack is too large to open.';
      return 'Could not download the pack (HTTP ' + status + ').';
    }

    function gs2ReadPackBody(resp, pack) {
      if (!resp.body || typeof resp.body.getReader !== 'function') {
        return resp.arrayBuffer().then(function (buf) {
          if (buf.byteLength > GS2_PACK_MAX_BYTES) throw gs2PackFail('That pack is larger than 200 MB.');
          return new Uint8Array(buf);
        });
      }
      var reader = resp.body.getReader();
      var chunks = [];
      var received = 0;
      function pump() {
        return reader.read().then(function (result) {
          if (result.done) {
            var out = new Uint8Array(received);
            var off = 0;
            for (var i = 0; i < chunks.length; i++) {
              out.set(chunks[i], off);
              off += chunks[i].byteLength;
            }
            return out;
          }
          received += result.value.byteLength;
          if (received > GS2_PACK_MAX_BYTES) {
            reader.cancel();
            throw gs2PackFail('That pack is larger than 200 MB.');
          }
          chunks.push(result.value);
          if (statusElement) {
            statusElement.textContent = 'Downloading ' + pack.name + '… '
              + (received / (1024 * 1024)).toFixed(1) + ' MB';
          }
          return pump();
        });
      }
      return pump();
    }

    function gs2FetchPack(pack) {
      return fetch(pack.url, { mode: 'cors', credentials: 'omit' }).then(function (resp) {
        if (!resp.ok) throw gs2PackFail(gs2PackErrorMessage(resp.status));
        var declared = Number(resp.headers.get('Content-Length') || '0');
        if (declared > GS2_PACK_MAX_BYTES) throw gs2PackFail('That pack is larger than 200 MB.');
        return gs2ReadPackBody(resp, pack).then(function (bytes) {
          return { resp: resp, bytes: bytes };
        });
      }).then(function (loaded) {
        var token = loaded.resp.headers.get('X-GS2-Save-Token') || '';
        try { FS.mkdir('/packs'); } catch (e) { /* already exists */ }
        var memPath = '/packs/' + pack.name;
        FS.writeFile(memPath, loaded.bytes);
        if (gs2UsableSecret(token) && gs2UsableSecret(pack.saveUrl)) {
          FS.writeFile(memPath + '.save-token', token);
          FS.writeFile(memPath + '.save-url', pack.saveUrl);
        }
        return memPath;
      }).catch(function (err) {
        if (err && err.gs2Pack) throw err;
        throw gs2PackFail('Could not download the pack from arQyv.');
      });
    }

    function gs2ShowCloseModal() {
      var modal = document.getElementById('pack-close');
      if (!modal) return;
      modal.style.display = 'flex';
      document.getElementById('pack-close-text').textContent =
        'Save this title to your arQyv Collection before closing?';
      document.getElementById('pack-close-detail').textContent = '';
      document.getElementById('pack-close-save').style.display = '';
      document.getElementById('pack-close-discard').style.display = '';
    }

    if (window.__gs2PackRequest) {
      window.__gs2Pack = gs2ParsePackUrl(window.__gs2PackRequest);
      if (!window.__gs2Pack) {
        gs2ShowPackError('GSSquared only opens packs from arqyv.net.');
      } else {
        overlaySpinner.style.display = 'none';
        overlayHint.textContent = 'Download ' + window.__gs2Pack.name
          + ' from ' + window.__gs2Pack.host + ' and launch?';
      }
    }

    var Module = {
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        // Reload the page if WebGL context is lost.
        canvas.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      // SDL's Emscripten backend manages a /tmp/filedrop directory for HTML5
      // drag-and-drop with unguarded FS.mkdir/FS.rmdir calls. SDL re-registers
      // the window's event handlers (e.g. when the window is recreated during
      // setup), so mkdir runs twice and the second throws EEXIST, which unwinds
      // out of SDL_CreateWindow and leaves a black canvas. We can't patch
      // vendored SDL, so make these two FS ops idempotent at the runtime level
      // (EEXIST on mkdir / ENOENT on rmdir become no-ops). Emscripten errno:
      // EEXIST = 20, ENOENT = 44.
      preRun: [function () {
        var origMkdir = FS.mkdir.bind(FS);
        FS.mkdir = function (path, mode) {
          try { return origMkdir(path, mode); }
          catch (e) { if (e && e.errno === 20) return undefined; throw e; }
        };
        var origRmdir = FS.rmdir.bind(FS);
        FS.rmdir = function (path) {
          try { return origRmdir(path); }
          catch (e) { if (e && e.errno === 44) return undefined; throw e; }
        };
      }, function () {
        // Hold startup until the confirmed pack is in MEMFS, then pass that
        // path as argv. C++ extracts it to /tmp the same way as a local pack.
        if (window.__gs2PackFailed || !window.__gs2Pack) return;
        addRunDependency('gs2pack');
        window.__gs2StartPackFetch = function () {
          if (window.__gs2PackFetchStarted) return;
          window.__gs2PackFetchStarted = true;
          gs2FetchPack(window.__gs2Pack).then(function (memPath) {
            // run() already captured programArgs. Mutate that array; replacing
            // Module.arguments now would not reach main.
            if (typeof programArgs !== 'undefined' && programArgs) {
              programArgs.length = 0;
              programArgs.push(memPath);
              Module.arguments = programArgs;
            } else {
              Module.arguments = [memPath];
            }
            removeRunDependency('gs2pack');
          }).catch(function (err) {
            gs2ShowPackError(err && err.message ? err.message : 'Could not download the pack from arQyv.');
            removeRunDependency('gs2pack');
          });
        };
        if (window.__gs2PackConfirmed) window.__gs2StartPackFetch();
      }],
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) {
        if (statusElement) statusElement.textContent = text;
        if (text === '') {
          runtimeReady = true;
          if (window.__gs2PackFailed) return;
          if (window.__gs2PackConfirmed) {
            // The confirm click already unlocked audio.
            overlayElement.style.display = 'none';
          } else if (!window.__gs2Pack) {
            // Runtime is up; let the user click to start (audio gesture).
            overlaySpinner.style.display = 'none';
            overlayHint.innerHTML = 'Click to start<br>Left Option / Windows = Open Apple<br>Right Option/Windows = Close Apple';
          }
          // After layout/paint, ask SDL to re-read CSS (same as a window resize).
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              window.dispatchEvent(new Event('resize'));
            });
          });
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ?
          'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' :
          '');
      }
    };
    Module.setStatus('Downloading...');

    // SDL's Emscripten backend only treats the window as keyboard-focused when
    // the canvas is document.activeElement. After Alt-Tab the browser returns
    // focus to <body>, not the canvas, so keyboard input silently dies. Keep the
    // canvas focused on (re)focus and on any click. This listener is registered
    // at page-parse time, i.e. BEFORE SDL adds its own window 'focus' handler,
    // so the canvas is already the activeElement when SDL checks.
    function focusCanvas() {
      if (Module.canvas && typeof Module.canvas.focus === 'function') {
        Module.canvas.focus();
      }
    }

    window.addEventListener('focus', focusCanvas);
    document.addEventListener('click', focusCanvas);

    // The browser blocks audio until a user gesture. A pack link uses this
    // click as the download confirmation. Otherwise hide the overlay once the
    // runtime is ready, and focus the canvas for keyboard.
    overlayElement.addEventListener('click', function () {
      if (window.__gs2Pack && !window.__gs2PackConfirmed && !window.__gs2PackFailed) {
        window.__gs2PackConfirmed = true;
        overlayElement.style.display = 'none';
        focusCanvas();
        window.dispatchEvent(new Event('resize'));
        if (window.__gs2StartPackFetch) window.__gs2StartPackFetch();
        return;
      }
      if (window.__gs2PackFailed) {
        overlayElement.style.display = 'none';
        focusCanvas();
        window.dispatchEvent(new Event('resize'));
        return;
      }
      if (!runtimeReady) return;
      overlayElement.style.display = 'none';
      focusCanvas();
      // Same path as a browser resize: SDL re-reads CSS and sizes the backing store.
      window.dispatchEvent(new Event('resize'));
    });

    document.getElementById('pack-close-save').addEventListener('click', function () {
      document.getElementById('pack-close-text').textContent = 'Saving to arQyv...';
      document.getElementById('pack-close-detail').textContent = '';
      try {
        ccall('gs2_web_save_collection', null, [], []);
      } catch (err) {
        console.error('gs2_web_save_collection', err);
      }
    });

    document.getElementById('pack-close-discard').addEventListener('click', function () {
      window.__gs2AllowClose = true;
      document.getElementById('pack-close-text').textContent =
        'You can close this tab. The Collection copy is unchanged.';
      document.getElementById('pack-close-detail').textContent = '';
      document.getElementById('pack-close-save').style.display = 'none';
      document.getElementById('pack-close-discard').style.display = 'none';
    });

    // C++ calls this when a Collection PUT finishes. Only the close modal cares;
    // an in-app Save to Collection reports through the emulator dialog.
    window.__gs2OnPutDone = function (status, error) {
      var modal = document.getElementById('pack-close');
      if (!modal || modal.style.display === 'none') return;
      if (status === 204) {
        window.__gs2AllowClose = true;
        document.getElementById('pack-close-text').textContent = 'Saved to arQyv. You can close this tab.';
        document.getElementById('pack-close-detail').textContent = '';
        document.getElementById('pack-close-save').style.display = 'none';
        document.getElementById('pack-close-discard').style.display = 'none';
        return;
      }
      document.getElementById('pack-close-text').textContent = 'The Collection copy was not updated.';
      var detail = error || 'Save to Collection again, or close this tab without saving.';
      if (status === 401) {
        detail = 'Play the title again to save to arQyv.';
      }
      document.getElementById('pack-close-detail').textContent = detail;
    };

    // beforeunload cannot show our dialog or wait for an upload. Cancel the
    // close, then ask. MEMFS does not survive a reload, so this is the only
    // chance to upload unsaved Collection changes.
    window.addEventListener('beforeunload', function (e) {
      if (window.__gs2AllowClose) return;
      var needs = 0;
      try {
        needs = ccall('gs2_web_pack_needs_save', 'number', [], []);
      } catch (err) {
        return;
      }
      if (!needs) return;
      e.preventDefault();
      e.returnValue = '';
      setTimeout(gs2ShowCloseModal, 0);
    });

    // Keep the canvas backing store matched to its host if layout changes
    // without a window resize (first paint, overlay, docked DevTools, etc.).
    if (typeof ResizeObserver !== 'undefined') {
      var host = document.getElementById('app');
      if (host) {
        new ResizeObserver(function () {
          window.dispatchEvent(new Event('resize'));
        }).observe(host);
      }
    }

    window.onerror = function (msg) {
      Module.setStatus('Exception thrown, see JavaScript console');
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
